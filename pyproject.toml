[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finn-flippemaskin"
version = "0.1.0"
description = "Lokalt, etterprøvbart analyseverktøy for brukthandel"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "streamlit>=1.50,<2", "requests>=2.32,<3", "beautifulsoup4>=4.14,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
finnflip = "finnflip.cli:main"

[tool.setuptools.packages.find]
include = ["finnflip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
